# Default deny; only the gateway is reachable from the ingress controller, and only
# account-service may call customer-service (incl. /internal/** eligibility checks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: banking}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-from-ingress, namespace: banking}
spec:
  podSelector: {matchLabels: {app: api-gateway}}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: services-from-gateway, namespace: banking}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [account-service, payment-service, transaction-service, notification-service]}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: customer-service-callers, namespace: banking}
spec:
  podSelector: {matchLabels: {app: customer-service}}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
        - podSelector: {matchLabels: {app: account-service}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: metrics-scrape, namespace: banking}
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
