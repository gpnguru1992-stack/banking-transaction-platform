# Full local stack. Build jars first:  mvn -DskipTests package
# Then:                                docker compose up -d --build
name: banking

x-service: &service
  build:
    context: .
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
    redis: {condition: service_healthy}
    keycloak: {condition: service_healthy}
  environment: &service-env
    SPRING_PROFILES_ACTIVE: docker
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    REDIS_HOST: redis
    JWT_ISSUER_URI: http://localhost:8180/realms/banking
    JWT_JWK_SET_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/common,classpath:db/seed
    JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | grep -q notification_db"]
      interval: 5s
      retries: 20

  kafka:
    image: mirror.gcr.io/apache/kafka:3.7.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      retries: 20

  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports: ["8180:8080"]
    volumes:
      - ./deploy/keycloak/banking-realm.json:/opt/keycloak/data/import/banking-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      retries: 30

  mailpit:
    image: mirror.gcr.io/axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  customer-service:
    <<: *service
    build: {context: ., args: {MODULE: customer-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
    ports: ["8081:8081"]

  account-service:
    <<: *service
    build: {context: ., args: {MODULE: account-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      CUSTOMER_SERVICE_URL: http://customer-service:8081
    ports: ["8082:8082"]

  payment-service:
    <<: *service
    build: {context: ., args: {MODULE: payment-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/common
      CLEARING_URL: http://clearing-simulator:8090
      NEFT_BATCH_INTERVAL: PT20S
    ports: ["8083:8083"]

  clearing-simulator:
    build: {context: ., args: {MODULE: clearing-simulator}}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8090
    ports: ["8090:8090"]

  transaction-service:
    <<: *service
    build: {context: ., args: {MODULE: transaction-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/common
    ports: ["8084:8084"]

  notification-service:
    <<: *service
    build: {context: ., args: {MODULE: notification-service}}
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/common
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ["8085:8085"]

  api-gateway:
    <<: *service
    build: {context: ., args: {MODULE: api-gateway}}
    environment:
      <<: *service-env
      SERVER_PORT: 8080
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports: ["8080:8080"]

  otel-collector:
    image: mirror.gcr.io/otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./deploy/otel/otel-collector.yml:/etc/otel/config.yml:ro"]
    ports: ["4318:4318"]

  jaeger:
    image: mirror.gcr.io/jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: mirror.gcr.io/prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: mirror.gcr.io/grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
