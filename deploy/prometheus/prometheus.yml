global:
  scrape_interval: 15s
scrape_configs:
  - job_name: banking-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - customer-service:8081
          - account-service:8082
          - payment-service:8083
          - transaction-service:8084
          - notification-service:8085
rule_files:
  - /etc/prometheus/alerts.yml
