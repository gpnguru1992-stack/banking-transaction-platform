name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build, unit + integration tests (Testcontainers)
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/*-reports/"
      - name: Validate docker-compose and Kubernetes manifests
        run: |
          docker compose config -q
          kubectl kustomize k8s/base > /dev/null
      - name: Build images
        run: |
          for m in api-gateway customer-service account-service payment-service transaction-service notification-service; do
            docker build --build-arg MODULE=$m -t ghcr.io/${{ github.repository_owner }}/banking-$m:${{ github.sha }} .
          done
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for m in api-gateway customer-service account-service payment-service transaction-service notification-service; do
            docker push ghcr.io/${{ github.repository_owner }}/banking-$m:${{ github.sha }}
          done
